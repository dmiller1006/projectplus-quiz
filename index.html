<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Project+ Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100dvh; overflow-x: hidden; }

  /* -- Setup screen -- */
  .screen { display: none; padding: 1rem; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }
  h1 { font-size: 1.3rem; text-align: center; padding: 1rem 0 0.5rem; color: #94a3b8; }
  h2 { font-size: 1rem; color: #64748b; margin: 1rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }

  .cat-list { list-style: none; }
  .cat-list li { padding: 0.7rem 0.8rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  .cat-list li.selected { background: #1e3a5f; }
  .cat-list li .name { flex: 1; }
  .cat-list li .badge { font-size: 0.75rem; color: #64748b; }
  .cat-list li .badge .flag { color: #f59e0b; margin-left: 4px; }

  .mode-btn { display: block; width: 100%; padding: 0.8rem; margin: 0.4rem 0; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 0.95rem; text-align: left; cursor: pointer; }
  .mode-btn:active { background: #334155; }
  .mode-btn.primary { background: #2563eb; border-color: #2563eb; text-align: center; font-weight: 600; }
  .mode-btn.primary:active { background: #1d4ed8; }
  .mode-btn.danger { color: #f87171; border-color: #7f1d1d; }
  .mode-btn.danger:active { background: #7f1d1d; }

  /* -- Quiz screen -- */
  .progress-bar { height: 3px; background: #1e293b; border-radius: 2px; margin-bottom: 1rem; }
  .progress-fill { height: 100%; background: #2563eb; border-radius: 2px; transition: width 0.3s; }
  .counter { text-align: center; font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem; }

  .card { background: #1e293b; border-radius: 12px; min-height: 220px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; user-select: none; position: relative; transition: transform 0.15s; }
  .card:active { transform: scale(0.98); }
  .card .label { position: absolute; top: 0.75rem; left: 0.75rem; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #475569; }
  .card .flag-dot { position: absolute; top: 0.75rem; right: 0.75rem; font-size: 0.8rem; }
  .card .text { font-size: 1.15rem; line-height: 1.5; }
  .card.answer { background: #172554; }
  .card.answer .text { font-size: 1rem; }

  .hint { text-align: center; color: #475569; font-size: 0.75rem; margin-top: 0.6rem; }

  .grade-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
  .grade-btn { flex: 1; padding: 1rem; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .grade-btn.wrong { background: #991b1b; color: #fecaca; }
  .grade-btn.wrong:active { background: #7f1d1d; }
  .grade-btn.right { background: #166534; color: #bbf7d0; }
  .grade-btn.right:active { background: #14532d; }

  /* -- Results screen -- */
  .score { text-align: center; font-size: 2.5rem; font-weight: 700; padding: 1.5rem 0; }
  .score .label { font-size: 0.85rem; color: #64748b; font-weight: 400; display: block; margin-top: 0.25rem; }
  .missed-list { list-style: none; margin: 0.5rem 0 1.5rem; }
  .missed-list li { padding: 0.5rem 0; border-bottom: 1px solid #1e293b; font-size: 0.9rem; color: #fbbf24; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="screen active">
  <h1>Project+ Flashcards</h1>
  <h2>Categories</h2>
  <ul id="catList" class="cat-list"></ul>
  <div style="margin-top:1.2rem" id="modeSection"></div>
  <label style="display:flex;align-items:center;gap:0.5rem;margin-top:1rem;color:#94a3b8;font-size:0.9rem;cursor:pointer;user-select:none"><input type="checkbox" id="chkShuffle" checked style="width:1.1rem;height:1.1rem;accent-color:#2563eb"> Shuffle cards</label>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="counter" id="counter"></div>
  <div class="card" id="card"><span class="label" id="cardLabel"></span><span class="flag-dot" id="flagDot"></span><span class="text" id="cardText"></span></div>
  <div class="hint" id="hint">tap to flip</div>
  <div class="grade-row" id="gradeRow" style="display:none">
    <button class="grade-btn wrong" id="btnWrong">Flag</button>
    <button class="grade-btn right" id="btnRight">Continue</button>
  </div>
  <div style="text-align:center;margin-top:1rem"><button class="mode-btn" id="btnQuit" style="max-width:160px;margin:0 auto;text-align:center;color:#f87171;border-color:#7f1d1d">Quit</button></div>
</div>

<!-- RESULTS -->
<div id="results" class="screen">
  <h1>Results</h1>
  <div class="score" id="scoreText"></div>
  <div id="missedSection"></div>
  <button class="mode-btn primary" id="btnRestart" style="margin-top:1rem">Study Again</button>
</div>

ith PO, Dev Team, and Scrum Master. Team reflects on how to improve and creates action items.", "flagged": false}, {"category": "Dependencies", "front": "Finish to Start (FS)", "back": "Successor starts when predecessor finishes. Most common relationship type.", "flagged": false}, {"category": "Execution", "front": "What are the 6 conflict resolution types?", "back": "Confronting (problem-solving, best), Compromising (both give up something), Smoothing (emphasize agreement, downplay differences), Forcing (win-lose, use authority), Avoiding (withdraw, postpone), Negotiating (bargaining for a solution).", "flagged": false}, {"category": "Tools & Charts", "front": "What is a Control Chart?", "back": "Checks that data points fall within control limits. Used for quality control.", "flagged": false}, {"category": "Scope", "front": "What is the Triple Constraint (Iron Triangle)?", "back": "Cost (budget), Time (schedule), and Scope. Change one and the others must adjust, or quality suffers.", "flagged": false}, {"category": "Closing", "front": "What is the Transition Plan?", "back": "Provides everything the new owner needs to use and maintain the product: delivery date, knowledge transfer, documentation, training, assets, maintenance, warranty, support, ongoing costs.", "flagged": false}, {"category": "Agile", "front": "What 3 criteria must sprint user stories meet?", "back": "1) Support the sprint goal. 2) Clearly defined, sized, and prioritized. 3) Total takes into account the team's velocity.", "flagged": false}, {"category": "Tools & Charts", "front": "What is a Fishbone (Ishikawa) Diagram?", "back": "Used for cause and effect analysis.", "flagged": false}, {"category": "Risk", "front": "Identified risks vs unidentified risks?", "back": "Identified = known risks (known unknowns). Unidentified = unknown risks (unknown unknowns).", "flagged": false}, {"category": "Dependencies", "front": "Discretionary dependency", "back": "Preferred logic \u2014 best practice but could be reordered. E.g. plumbing first then electrics.", "flagged": false}, {"category": "Scope", "front": "What does the Scope Statement include?", "back": "Project/product descriptions, major deliverables, and exclusions. Approved version becomes part of scope baseline.", "flagged": false}, {"category": "Agile", "front": "What are user stories and where do they live?", "back": "Describe a feature from a business value perspective. Live on the product backlog (master story list).", "flagged": false}, {"category": "IT Concepts", "front": "Cloud vs on-prem change control difference?", "back": "Cloud = more frequent backups/changes, provider handles infrastructure. On-prem = you control backup frequency and change windows.", "flagged": false}, {"category": "Risk", "front": "What is the Risk Register?", "back": "Lists all identified risks with planned response, priority, and owner. Reviewed throughout the project.", "flagged": false}, {"category": "Estimating", "front": "Bottom-up estimating", "back": "Every single component calculated and totalled. Most accurate but most time consuming.", "flagged": false}, {"category": "Documents", "front": "SOW vs SLA?", "back": "SOW (Statement of Work) defines the work to be performed. SLA (Service Level Agreement) defines ongoing service expectations and metrics.", "flagged": false}, {"category": "Agile", "front": "How are changes managed in agile?", "back": "Changes are expected \u2014 managed by re-prioritizing items on the product backlog. No formal change control.", "flagged": false}, {"category": "Change Control", "front": "What is scope creep?", "back": "The uncontrolled expansion of scope without adjustments to time, cost, and resources.", "flagged": false}, {"category": "EVM & Formulas", "front": "Schedule Variance (SV) formula and what it means?", "back": "SV = EV - PV. Positive = ahead of schedule. Negative = behind. Zero = on pace. Trap: 'greater than zero' = AHEAD, not behind.", "flagged": false}, {"category": "EVM & Formulas", "front": "What are the 4 types of float?", "back": "Zero float = critical path task, no wiggle room. Free float = ES(next) - EF(current), can slip without affecting NEXT task. Total float = LF - EF (or LS - ES), can slip without affecting PROJECT end date. Negative float = Late Start < Early Start, already behind schedule.", "flagged": false}, {"category": "Procurement", "front": "RFx distinctions \u2014 RFI, RFP, RFQ, RFB?", "back": "RFI = exploratory, gathering info, no commitment. RFP = need a solution, vendor proposes approach, best value wins. RFQ = know what you want, just need pricing. RFB = clear specs, commodity items, lowest price wins. Order: RFI first (exploratory) then RFP/RFB/RFQ (soliciting).", "flagged": false}, {"category": "Procurement", "front": "Contract types \u2014 cost-plus, fixed-price, T&M, unit price?", "back": "Cost-plus = vendor paid costs + profit fee, flexible scope, risk of SCOPE CREEP. Fixed-price = set price/scope, risk on vendor. T&M = hours x rate + materials, fluid scope. Unit price = price per unit x quantity. Trap: 'scope creep risk' = cost-plus, NOT T&M.", "flagged": false}, {"category": "Execution", "front": "What is Organizational Change Management (OCM)?", "back": "The 'people side of change.' Helping USERS adjust to change \u2014 identifying impacted groups, training, documenting change for stability. NOT about budget changes, vendor issues, or sprint task changes.", "flagged": false}, {"category": "Scope", "front": "MECE vs 100% Rule in WBS design?", "back": "MECE = Mutually Exclusive, Collectively Exhaustive \u2014 no overlaps AND no gaps. 100% Rule = all project work is covered, no extra work added. They are DIFFERENT concepts. 'No overlaps + no gaps' = MECE.", "flagged": false}, {"category": "Estimating", "front": "Top-down estimating", "back": "Used early when info is limited. Start with total, break down into components. Benefits most from expert judgment. Trigger: 'limited info, early stages' = top-down.", "flagged": false}, {"category": "Tools & Charts", "front": "Burnup vs Burndown \u2014 which is fixed scope vs fixed timeline?", "back": "Burnup = fixed SCOPE, flexible timeline (line goes up toward total). Burndown = fixed TIMELINE, flexible scope (line goes down to zero). Memory: burnUP = scope is Up (fixed). Trigger: 'fixed scope, flexible timeline' = ALWAYS burnup.", "flagged": false}, {"category": "Agile", "front": "Velocity threshold for investigation?", "back": "25% or more change in velocity across sprints = investigate. NOT 10%.", "flagged": false}, {"category": "EVM & Formulas", "front": "ROI formula and terminology?", "back": "Financial Value = money in (revenue, savings). Net Profit = Financial Value - Project Cost. ROI = Net Profit / Project Cost x 100. E.g. $20k value, $11k cost = $9k profit = 81.8% ROI.", "flagged": false}, {"category": "Discovery", "front": "What is ESG?", "back": "Environmental = nature/planet. Social = people/employees (treating people well). Governance = how the COMPANY governs itself (policies, board, ethics). Trap: employee benefits = Social. Stakeholder engagement = Governance.", "flagged": false}, {"category": "Initiation", "front": "Org structures \u2014 Functional vs Matrix vs Projectized?", "back": "Functional = silos, functional manager has authority. Matrix = employees have TWO managers, work on MULTIPLE projects simultaneously. Projectized = PM has full authority, team dedicated. Spectrum: Functional \u2192 Weak Matrix \u2192 Strong Matrix \u2192 Projectized. 'Exclusively' = rules out Matrix.", "flagged": false}, {"category": "Initiation", "front": "PMO types \u2014 Supportive, Controlling, Directive?", "back": "Supportive = low authority, provides templates/guidance. Controlling = medium authority, enforces frameworks/compliance. Directive = high authority, directly manages projects. PMO is ALWAYS a stakeholder.", "flagged": false}, {"category": "Approaches", "front": "Iterative vs Incremental vs IID?", "back": "Iterative = build, review, improve (adapt/refine). No release until end. Incremental = build feature, release to production. IID = both together (iterative + incremental). Agile = IID.", "flagged": false}, {"category": "Execution", "front": "Tuckman Model \u2014 5 stages of team development?", "back": "Forming \u2192 Storming \u2192 Norming \u2192 Performing \u2192 Adjourning. Unstable teams cycle back (especially to storming). Changing members or priorities \u2192 reverts to storming.", "flagged": false}, {"category": "Security", "front": "Data Classification \u2014 PICR hierarchy?", "back": "Public (no restrictions) < Internal (anyone in company) < Confidential (authorized users, role-based) < Restricted (most sensitive, need-to-know). 'Private' = doesn't exist. 'Secret' falls under Restricted. Medical/financial records = Confidential.", "flagged": false}, {"category": "IT Concepts", "front": "What are NFRs (Non-Functional Requirements)?", "back": "HOW the system performs, not WHAT it does. The '-ilities': Usability, Maintainability, Scalability, Availability, Extensibility, Security, Portability, Compliance. Apply to ALL projects. Match keywords exactly: 'protected communication' = Security, 'regulatory' = Compliance.", "flagged": false}, {"category": "Initiation", "front": "Program vs Portfolio?", "back": "Program = group of RELATED projects managed together for benefits not available individually. Portfolio = ALL projects in an organization \u2014 do NOT need to be related.", "flagged": false}, {"category": "Planning", "front": "Communication plan components?", "back": "Includes: Goals, Outcomes, Channels, Artifacts. Does NOT include: Retrospectives (those are project review processes, not communication plan components).", "flagged": false}, {"category": "Planning", "front": "Phase sorting traps \u2014 what goes where?", "back": "Discovery: business case, ROI, current/future state. Initiation: charter, RAM, RACI, communication channels, kickoff. Planning: project schedule, WBS, budget, scope statement, units of work. Trap: scope statement = PLANNING, not initiation. RAM/RACI = INITIATION, not planning.", "flagged": false}];

const LS_KEY = 'pplus_flags';

// Load persisted flags from localStorage
function loadFlags() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY));
    if (saved) {
      const map = {};
      saved.forEach(f => map[f] = true);
      CARDS.forEach(c => { c.flagged = !!map[c.front]; });
    }
  } catch(e) {}
}

function saveFlags() {
  const flagged = CARDS.filter(c => c.flagged).map(c => c.front);
  localStorage.setItem(LS_KEY, JSON.stringify(flagged));
}

loadFlags();

// --- State ---
let deck = [];
let idx = 0;
let flipped = false;
let correct = 0;
let wrong = [];

// --- Screens ---
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// --- Setup ---
let currentSelected = new Set();

function buildSetup() {
  const cats = [...new Set(CARDS.map(c => c.category))].sort();
  currentSelected = new Set();
  const list = document.getElementById('catList');

  function render() {
    list.innerHTML = '';
    const allLi = document.createElement('li');
    allLi.className = currentSelected.size === cats.length ? 'selected' : '';
    const totalFlagged = CARDS.filter(c => c.flagged).length;
    allLi.innerHTML = `<span class="name">All</span><span class="badge">${CARDS.length}${totalFlagged ? `<span class="flag"> ${totalFlagged} flagged</span>` : ''}</span>`;
    allLi.onclick = () => { if (currentSelected.size === cats.length) { currentSelected.clear(); } else { cats.forEach(c => currentSelected.add(c)); } render(); };
    list.appendChild(allLi);

    cats.forEach(cat => {
      const li = document.createElement('li');
      li.className = currentSelected.has(cat) ? 'selected' : '';
      const count = CARDS.filter(c => c.category === cat).length;
      const flagged = CARDS.filter(c => c.category === cat && c.flagged).length;
      li.innerHTML = `<span class="name">${cat}</span><span class="badge">${count}${flagged ? `<span class="flag"> ${flagged} flagged</span>` : ''}</span>`;
      li.onclick = () => { currentSelected.has(cat) ? currentSelected.delete(cat) : currentSelected.add(cat); render(); };
      list.appendChild(li);
    });

    buildModeButtons();
  }

  render();
}

function buildModeButtons() {
  const section = document.getElementById('modeSection');
  const hasCats = currentSelected.size > 0;
  const pool = hasCats ? CARDS.filter(c => currentSelected.has(c.category)) : CARDS;
  const flagged = pool.filter(c => c.flagged);
  const allFlagged = CARDS.filter(c => c.flagged);

  section.innerHTML = '';

  if (hasCats) {
    const btnAll = document.createElement('button');
    btnAll.className = 'mode-btn primary';
    btnAll.textContent = `Study Selected (${pool.length})`;
    btnAll.onclick = () => launchQuiz('all');
    section.appendChild(btnAll);
  }

  const btnFlagged = document.createElement('button');
  btnFlagged.className = 'mode-btn';
  btnFlagged.textContent = `Flagged Only (${allFlagged.length})`;
  if (allFlagged.length) {
    btnFlagged.style.cssText = 'border-color:#f59e0b;color:#f59e0b';
    btnFlagged.onclick = () => launchFlagged();
  } else {
    btnFlagged.disabled = true;
    btnFlagged.style.opacity = '0.35';
  }
  section.appendChild(btnFlagged);

  if (allFlagged.length) {
    const btnClear = document.createElement('button');
    btnClear.className = 'mode-btn danger';
    btnClear.textContent = 'Clear All Flags';
    btnClear.onclick = () => { CARDS.forEach(c => c.flagged = false); saveFlags(); buildSetup(); };
    section.appendChild(btnClear);
  }
}

function launchFlagged() {
  let pool = CARDS.filter(c => c.flagged);
  if (!pool.length) return;
  deck = document.getElementById('chkShuffle').checked ? shuffle([...pool]) : [...pool];
  idx = 0; correct = 0; wrong = []; flipped = false;
  show('quiz');
  renderCard();
}

function launchQuiz() {
  let pool = currentSelected.size > 0 ? CARDS.filter(c => currentSelected.has(c.category)) : CARDS;
  if (!pool.length) return;

  deck = document.getElementById('chkShuffle').checked ? shuffle([...pool]) : [...pool];
  idx = 0; correct = 0; wrong = []; flipped = false;
  show('quiz');
  renderCard();
};

// --- Quiz ---
function renderCard() {
  const card = deck[idx];
  document.getElementById('counter').textContent = `${idx + 1} / ${deck.length}`;
  document.getElementById('progressFill').style.width = `${((idx) / deck.length) * 100}%`;
  document.getElementById('cardLabel').textContent = card.category;
  document.getElementById('flagDot').textContent = card.flagged ? '\u2691' : '';
  document.getElementById('cardText').textContent = card.front;
  document.getElementById('card').className = 'card';
  document.getElementById('hint').textContent = 'tap to flip';
  document.getElementById('gradeRow').style.display = 'none';
  flipped = false;
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  const card = deck[idx];
  document.getElementById('cardText').textContent = card.back;
  document.getElementById('card').className = 'card answer';
  document.getElementById('hint').textContent = '';
  document.getElementById('gradeRow').style.display = 'flex';
}

function grade(gotIt) {
  const card = deck[idx];
  if (gotIt) {
    correct++;
    card.flagged = false;
  } else {
    wrong.push(card);
    card.flagged = true;
  }
  saveFlags();
  idx++;
  if (idx >= deck.length) { showResults(); return; }
  renderCard();
}

document.getElementById('card').addEventListener('click', flipCard);
document.getElementById('btnWrong').addEventListener('click', () => grade(false));
document.getElementById('btnRight').addEventListener('click', () => grade(true));
document.getElementById('btnQuit').addEventListener('click', () => showResults());

// Keyboard support
document.addEventListener('keydown', e => {
  const quizActive = document.getElementById('quiz').classList.contains('active');
  if (!quizActive) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!flipped) flipCard(); }
  if (flipped && (e.key === 'n' || e.key === 'ArrowLeft')) grade(false);
  if (flipped && (e.key === 'y' || e.key === 'ArrowRight')) grade(true);
});

// --- Results ---
function showResults() {
  show('results');
  const pct = deck.length ? Math.round((correct / deck.length) * 100) : 0;
  document.getElementById('scoreText').innerHTML = `${correct}/${deck.length}<span class="label">${pct}%</span>`;

  let html = '';
  if (wrong.length) {
    html += '<h2>Missed (now flagged)</h2><ul class="missed-list">';
    wrong.forEach(c => { html += `<li>${c.front}</li>`; });
    html += '</ul>';
  }
  document.getElementById('missedSection').innerHTML = html;
}

document.getElementById('btnRestart').addEventListener('click', () => { show('setup'); buildSetup(); });

// --- Util ---
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// Init
buildSetup();
</script>
</body>
</html>
